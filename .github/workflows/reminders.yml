name: rappels J-1

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: déclenche /api/cron/reminders
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders")"
          echo "HTTP $response : $(cat /tmp/body)"
          [ "$response" = "200" ]
